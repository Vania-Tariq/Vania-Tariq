<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>😂 Random Joke Generator</h1>
        <p class="subtitle">Get a laugh with random jokes from the API</p>
        
        <div class="joke-card">
            <div id="joke-text" class="joke-text">
                Loading a joke for you...
            </div>
        </div>

        <div class="button-group">
            <button id="get-joke-btn" class="btn btn-primary">Get a Joke</button>
            <button id="copy-btn" class="btn btn-secondary" title="Copy joke to clipboard">
                📋 Copy
            </button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
